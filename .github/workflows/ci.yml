name: ci

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  APP_ENV: testing
  CONFIG_PATH: config.yaml
  DATA_INGESTION_SOURCE: local

jobs:
  validate:
    name: Validate, Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest ruff

      - name: Ruff Lint
        run: |
          ruff check .

      - name: Validate Project
        run: |
          python scripts/validate_project.py

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q

      - name: Build Docker Image
        run: |
          docker build -t phishguard-ai:ci .

      - name: Health Check Container
        run: |
          docker run -d \
            --name phishguard-ai-ci \
            -p 8000:8000 \
            phishguard-ai:ci

          for i in {1..20}; do
            if curl -fsS http://localhost:8000/health; then
              docker rm -f phishguard-ai-ci
              exit 0
            fi
            sleep 3
          done

          docker logs phishguard-ai-ci
          docker rm -f phishguard-ai-ci
          exit 1