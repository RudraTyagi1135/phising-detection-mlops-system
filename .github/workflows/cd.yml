name: cd

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  APP_ENV: production
  CONFIG_PATH: config.yaml
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_NAME: ${{ secrets.ECR_REPOSITORY_NAME }}
  ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
  ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
  ECS_TASK_DEFINITION_FAMILY: ${{ secrets.ECS_TASK_DEFINITION_FAMILY }}
  ECS_CONTAINER_NAME: ${{ secrets.ECS_CONTAINER_NAME }}
  ECS_EXECUTION_ROLE_ARN: ${{ secrets.ECS_EXECUTION_ROLE_ARN }}
  ECS_TASK_ROLE_ARN: ${{ secrets.ECS_TASK_ROLE_ARN }}
  MONGODB_URI_SECRET_ARN: ${{ secrets.MONGODB_URI_SECRET_ARN }}
  DAGSHUB_TOKEN_SECRET_ARN: ${{ secrets.DAGSHUB_TOKEN_SECRET_ARN }}
  DAGSHUB_REPO_OWNER: ${{ secrets.DAGSHUB_REPO_OWNER }}
  DAGSHUB_REPO_NAME: ${{ secrets.DAGSHUB_REPO_NAME }}
  DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
  DVC_REMOTE_URL: ${{ secrets.DVC_REMOTE_URL }}
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}

jobs:
  deploy:
    name: Build, push, and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install deployment dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dvc dvc-http PyYAML python-dotenv

      - name: Validate deployment secrets
        run: python scripts/validate_secrets.py --mode cd

      - name: Configure DVC remote
        run: |
          dvc remote modify dagshub url "$DVC_REMOTE_URL"
          dvc remote modify --local dagshub auth basic
          dvc remote modify --local dagshub user "$DAGSHUB_REPO_OWNER"
          dvc remote modify --local dagshub password "$DAGSHUB_TOKEN"

      - name: Pull DVC artifacts
        run: |
          dvc pull network_data/phisingData.csv.dvc
          dvc pull final_model/model.pkl.dvc
          dvc pull final_model/preprocessor.pkl.dvc

      - name: Configure AWS credentials with OIDC
        if: env.AWS_ROLE_TO_ASSUME != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials with access keys
        if: env.AWS_ROLE_TO_ASSUME == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY_NAME" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$ECR_REPOSITORY_NAME" >/dev/null

      - name: Build and push image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY_NAME:$IMAGE_TAG"
          docker build -t "$IMAGE_URI" -t "$ECR_REGISTRY/$ECR_REPOSITORY_NAME:latest" .
          docker push "$IMAGE_URI"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY_NAME:latest"
          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Prepare ECS task definition
        run: |
          jq \
            --arg family "$ECS_TASK_DEFINITION_FAMILY" \
            --arg executionRoleArn "$ECS_EXECUTION_ROLE_ARN" \
            --arg taskRoleArn "$ECS_TASK_ROLE_ARN" \
            --arg containerName "$ECS_CONTAINER_NAME" \
            --arg awsRegion "$AWS_REGION" \
            --arg dagshubOwner "$DAGSHUB_REPO_OWNER" \
            --arg dagshubRepo "$DAGSHUB_REPO_NAME" \
            --arg mlflowUri "$MLFLOW_TRACKING_URI" \
            --arg mongodbSecret "$MONGODB_URI_SECRET_ARN" \
            --arg dagshubSecret "$DAGSHUB_TOKEN_SECRET_ARN" \
            '.family = $family
             | .executionRoleArn = $executionRoleArn
             | .taskRoleArn = $taskRoleArn
             | .containerDefinitions[0].name = $containerName
             | .containerDefinitions[0].environment = [
                {"name": "APP_ENV", "value": "production"},
                {"name": "CONFIG_PATH", "value": "config.yaml"},
                {"name": "DATA_INGESTION_SOURCE", "value": "mongodb"},
                {"name": "TRAINING_ENDPOINT_ENABLED", "value": "false"},
                {"name": "AWS_REGION", "value": $awsRegion},
                {"name": "DAGSHUB_REPO_OWNER", "value": $dagshubOwner},
                {"name": "DAGSHUB_REPO_NAME", "value": $dagshubRepo},
                {"name": "MLFLOW_TRACKING_URI", "value": $mlflowUri},
                {"name": "MLFLOW_TRACKING_USERNAME", "value": $dagshubOwner}
              ]
             | .containerDefinitions[0].secrets = [
                {"name": "MONGODB_URI", "valueFrom": $mongodbSecret},
                {"name": "DAGSHUB_TOKEN", "valueFrom": $dagshubSecret},
                {"name": "MLFLOW_TRACKING_PASSWORD", "valueFrom": $dagshubSecret}
              ]
             | .containerDefinitions[0].logConfiguration.options."awslogs-region" = $awsRegion' \
            deploy/aws/ecs-task-definition.json > task-definition.json

      - name: Render ECS task definition image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.image.outputs.image }}

      - name: Deploy ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
