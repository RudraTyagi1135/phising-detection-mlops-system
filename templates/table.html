<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prediction Results</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 24px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid #d0d7de;
            padding: 8px;
            text-align: left;
        }
        th {
            background: #f6f8fa;
        }
        .request-id {
            color: #57606a;
            font-size: 14px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <h2>Prediction Results</h2>
    {% if request_id %}
    <div class="request-id">Request ID: {{ request_id }}</div>
    {% endif %}
    {{ table | safe }}
</body>
</html>
